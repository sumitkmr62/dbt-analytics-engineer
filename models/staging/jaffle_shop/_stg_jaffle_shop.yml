models:
  - name: stg_dbt_hrussa__customers
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: stg_dbt_hrussa__orders
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: order_status
        data_tests:
          - accepted_values:
              values:
               - completed
               - shipped
               - placed
               - return_pending
               - returned
      - name: customer_id
        data_tests:
          - relationships:
              field: customer_id
              to: ref('stg_dbt_hrussa__customers')